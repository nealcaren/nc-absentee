name: Update tracker

on:
  schedule:
    # 10:30 and 16:30 Eastern. NCSBE posts the daily file mid-morning.
    - cron: '30 14 * * *'
    - cron: '30 20 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch and parse the newest absentee file
        run: python3 work/ingest.py

      - name: Build the site
        run: python3 work/build_site.py

      # The vintage log is the audit trail: without committing it, each run
      # would start with no record of what was forecast on prior days.
      - name: Record the forecast
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/observed.json data/vintages.json
          if git diff --cached --quiet; then
            echo "No change since last run"
          else
            git commit -m "data: early voting through $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
