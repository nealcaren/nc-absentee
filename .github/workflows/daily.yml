name: Update tracker

on:
  schedule:
    # Daily at 6am ET (10:00 UTC while on EDT). NCSBE posts the daily file
    # around 5:25am ET. Cron is UTC, so after DST ends on Nov 1 this fires at
    # 5am EST; move it to '0 11 * * *' if that's too early.
    - cron: '0 10 * * *'
    # Backup at 9am ET in case the file posts late or the first run fails.
    # A run that finds no new file changes nothing.
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch and parse the newest absentee file
        run: python3 work/ingest.py

      - name: Build the site
        run: python3 work/build_site.py

      # The vintage log is the audit trail: without committing it, each run
      # would start with no record of what was forecast on prior days.
      - name: Record the forecast
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/observed.json data/vintages.json
          if git diff --cached --quiet; then
            echo "No change since last run"
          else
            git commit -m "data: early voting through $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
